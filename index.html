<style>
/* Layout: mesa escura de carteado. A carta preta é o palco; as brancas são o elenco. Magenta só onde há ação ou vitória. */
:root{
  --mesa:#0D0C0C; --mesa-2:#191717; --mesa-3:#252222; --linha:rgba(245,242,234,.14);
  --branca:#F5F2EA; --tinta:#111; --suave:#A8A29A; --quente:#FF2E7E; --quente-esc:#C8125A; --ok:#5BD69A;
  --f-sigla:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-texto:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{background:var(--mesa);color:var(--branca)}
body{margin:0;font-family:var(--f-texto);font-size:16px;line-height:1.4}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--quente);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:1320px;margin-inline:auto;padding-inline:16px;padding-block:14px 40px;display:grid;gap:22px}
.app.fone{max-width:560px}
@media (min-width:1000px){.app.tv-jogo{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.app.tv-jogo .topo{grid-column:1/-1}}
.topo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
.marca{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sigla{font-family:var(--f-sigla);font-weight:400;font-size:clamp(34px,6vw,58px);line-height:.9;letter-spacing:.02em}
.sigla i{font-style:normal;color:var(--quente)}
.extenso{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--linha);border-radius:999px;padding:4px 10px;color:var(--suave);white-space:nowrap}
.chip.quente{color:var(--quente);border-color:var(--quente)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
.bloco{display:grid;gap:12px;min-width:0}
.rotulo{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.nota{font-size:14px;color:var(--suave);max-width:66ch}
.chamada{font-family:var(--f-sigla);font-weight:400;font-size:clamp(28px,4vw,44px);line-height:1.02;letter-spacing:.01em;text-wrap:balance}
.painel{background:var(--mesa-2);border:1px solid var(--linha);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}

.btn{background:var(--quente);color:#fff;border:0;border-radius:10px;font-weight:900;font-size:16px;padding:12px 18px;min-height:48px;letter-spacing:.01em}
.btn.sec{background:transparent;color:var(--branca);border:1.5px solid var(--linha)}
.btn.mini{font-size:13px;padding:6px 11px;min-height:34px;border-radius:8px}
.btn.claro{background:var(--branca);color:var(--tinta)}
.btn.largo{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;border:1.5px solid var(--linha);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--branca);color:var(--tinta);border-color:var(--branca)}
.ajustes{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
input[type=text],textarea{background:var(--mesa-2);border:1.5px solid var(--linha);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.linha-form{display:flex;gap:8px;flex-wrap:wrap}
.linha-form input{flex:1 1 180px}

/* Entrada */
.entrada{display:grid;gap:18px;grid-template-columns:auto minmax(0,1fr);align-items:center;background:var(--mesa-2);border-radius:14px;padding:16px}
@media (max-width:620px){.entrada{grid-template-columns:minmax(0,1fr)}}
.qr{background:#fff;padding:10px;border-radius:10px;width:max-content}
.qr img,.qr canvas{display:block;width:180px;height:180px}
.codigo{font-family:var(--f-sigla);font-size:clamp(44px,7vw,68px);line-height:1;letter-spacing:.08em;color:var(--quente)}
.endereco{font-size:13px;color:var(--suave);overflow-wrap:anywhere}
.pessoas{display:flex;flex-wrap:wrap;gap:8px}
.pessoa{display:flex;align-items:center;gap:6px;background:var(--mesa-3);border-radius:999px;padding:6px 6px 6px 14px;font-weight:800}
.pessoa.pronto{background:var(--branca);color:var(--tinta)}
.pessoa.espera{opacity:.55}
.pessoa .x{background:transparent;border:0;color:var(--suave);font-weight:800;font-size:13px;padding:4px 8px}
.pessoa .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--quente);color:#fff;border-radius:999px;padding:2px 7px}

/* Cartas */
.preta{background:#000;color:#fff;border:2px solid #fff;border-radius:18px;padding:clamp(20px,3vw,34px);display:grid;gap:18px;min-height:220px;align-content:space-between;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.preta .t{font-weight:900;font-size:clamp(26px,3.6vw,46px);line-height:1.12;text-wrap:balance}
.preta .rod{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#aaa}
.lacuna{display:inline-block;min-width:3.4em;border-bottom:.12em solid currentColor;margin:0 .08em;transform:translateY(-.08em)}
.fone .preta{min-height:0;border-radius:14px}
.fone .preta .t{font-size:clamp(21px,6vw,28px)}
mark{background:none;color:var(--quente);font-weight:900}
.preta mark{color:var(--quente)}

.respostas{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.resposta{background:var(--branca);color:var(--tinta);border-radius:14px;padding:16px 16px 14px;display:grid;gap:10px;align-content:space-between;min-height:140px;border:3px solid transparent;text-align:left;animation:entra .45s ease-out both}
.resposta .frase{font-weight:800;font-size:clamp(17px,1.6vw,21px);line-height:1.22}
.resposta .frase mark{color:var(--quente-esc)}
.resposta .letra{font-family:var(--f-sigla);font-size:22px;color:#777;line-height:1}
.resposta.venceu{border-color:var(--quente);box-shadow:0 0 0 4px rgba(255,46,126,.25)}
.resposta.perdeu{opacity:.32}
.resposta .dono{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--quente-esc)}
@keyframes entra{from{opacity:0;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.resposta{animation:none}}
.fone .resposta{animation:none}
.resposta:disabled{opacity:.4;cursor:not-allowed}
button.resposta{cursor:pointer;font:inherit}
button.resposta[aria-pressed="true"]{border-color:var(--quente)}
.vitoria{display:grid;gap:10px}
.vitoria .quem{font-family:var(--f-sigla);font-size:clamp(30px,4vw,48px);color:var(--quente);line-height:1}

/* Mão */
.mao{display:grid;gap:8px}
.carta-mao{position:relative;background:var(--branca);color:var(--tinta);border-radius:12px;padding:13px 44px 13px 14px;font-weight:800;font-size:16.5px;line-height:1.25;text-align:left;border:3px solid transparent;min-height:56px}
.carta-mao[aria-pressed="true"]{border-color:var(--quente)}
.carta-mao .n{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--quente);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px}
.carta-mao.descartar{opacity:.45;text-decoration:line-through;border-color:#999}
.previa{background:var(--mesa-2);border-radius:12px;padding:14px;font-weight:800;font-size:17px;line-height:1.3}

/* Placar */
.placar li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-weight:800}
.placar li b{font-family:var(--f-sigla);font-weight:400;font-size:22px;color:var(--quente)}
.placar li.lider span{color:var(--quente)}
.momentos li{padding:10px 0;border-top:1px solid var(--linha);display:grid;gap:4px}
.momentos .frase{font-weight:800}
.momentos .frase mark{color:var(--quente)}
.momentos .de{font-size:13px;color:var(--suave);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.podio{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.podio div{background:var(--mesa-2);border-radius:14px;padding:16px;display:grid;gap:4px}
.podio div:first-child{background:var(--quente);color:#fff}
.podio .pos{font-family:var(--f-sigla);font-size:40px;line-height:1}
.podio .nm{font-weight:900;font-size:20px;overflow-wrap:anywhere}
.aviso{background:var(--mesa-2);border-left:4px solid var(--quente);border-radius:8px;padding:12px 14px;font-size:14.5px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
"use strict";

/* ---------------- nomes do jogo ---------------- */
const TITULOS={
  bdsm:{s:'B<i>.</i>D<i>.</i>S<i>.</i>M<i>.</i>',n:"Baralho Desgraçado Sem Moral",txt:"B.D.S.M."},
  puta:{s:'P<i>.</i>U<i>.</i>T<i>.</i>A<i>.</i>',n:"Piadas Ultrajantes, Totalmente Absurdas",txt:"P.U.T.A."}
};
const NIVEIS={M:"Morno",A:"Ácido",S:"Sem perdão",T:"Da turma"};
const MAO=10, TROCA_MAX=7, TROCA_CADA=5;

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sorte=n=>Math.floor(Math.random()*n);
const embaralha=a=>{for(let i=a.length-1;i>0;i--){const j=sorte(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const novoId=()=>Math.random().toString(36).slice(2,10);
const lista=n=>n.length<2?n.join(""):n.slice(0,-1).join(", ")+" e "+n[n.length-1];
const pl=(n,um,v)=>n+" "+(n===1?um:v);
const guardar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const abrir=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const arr=v=>Array.isArray(v)?v:(v&&typeof v==="object"?Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]):[]);
function novoCodigo(){const L="BCDFGHJKLMNPQRSTVWXZ";let c="";for(let i=0;i<4;i++)c+=L[sorte(L.length)];return c;}
const lacunas=t=>Math.max(1,t.split("___").length-1);

/* encaixa as respostas nas lacunas */
function ajustar(resp,antes){
  let r=resp.trim().replace(/\.$/,"");
  const fim=antes.replace(/\s+$/,"");
  const inicioFrase=!fim||/[.?!"“:]$/.test(fim)&&!/:$/.test(fim)||/"$/.test(fim);
  const prim=r.split(" ")[0]||"";
  if(!inicioFrase&&/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç-]*,?$/.test(prim)&&["Mercúrio"].indexOf(prim)<0) r=r[0].toLowerCase()+r.slice(1);
  return r;
}
function preencher(preta,textos,marcar){
  const partes=preta.split("___"); let h="";
  partes.forEach((p,i)=>{
    h+=esc(p);
    if(i<partes.length-1){
      const t=textos&&textos[i];
      h+=t!=null?(marcar===false?esc(ajustar(t,partes.slice(0,i+1).join(""))):'<mark>'+esc(ajustar(t,partes.slice(0,i+1).join("")))+'</mark>'):'<span class="lacuna"></span>';
    }
  });
  return h;
}

/* ---------------- rede ---------------- */
const CFG=window.FIREBASE_CONFIG||{};
const temFirebase=!!(CFG.databaseURL&&window.firebase&&firebase.database);
const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
function redeFirebase(){
  firebase.initializeApp(CFG); const db=firebase.database();
  const r={tipo:"firebase",conectado:false,
    ouvir(p,cb){const ref=db.ref(p),f=s=>cb(s.val());ref.on("value",f);return()=>ref.off("value",f);},
    set(p,v){return db.ref(p).set(v);},update(p,o){return db.ref(p).update(o);},remove(p){return db.ref(p).remove();}};
  db.ref(".info/connected").on("value",s=>{r.conectado=!!s.val();desenhar();});
  return r;
}
function redeLocal(){
  const KEY="bdsm-rede-local",ouv=[];let bc=null;try{bc=new BroadcastChannel("bdsm");}catch(e){}
  const ler=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){return {};}};
  const pegar=(db,p)=>p.split("/").reduce((o,k)=>o&&o[k]!==undefined?o[k]:null,db);
  const por=(db,p,v)=>{const ks=p.split("/");let o=db;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=clone(v);};
  const avisar=()=>{const db=ler();ouv.slice().forEach(l=>l.cb(clone(pegar(db,l.p))));};
  const gravar=db=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}avisar();if(bc)bc.postMessage(1);};
  if(bc)bc.onmessage=avisar; window.addEventListener("storage",e=>{if(e.key===KEY)avisar();});
  return {tipo:"local",conectado:true,
    ouvir(p,cb){const l={p,cb};ouv.push(l);setTimeout(()=>cb(clone(pegar(ler(),p))),0);return()=>{const i=ouv.indexOf(l);if(i>=0)ouv.splice(i,1);};},
    set(p,v){const db=ler();por(db,p,v);gravar(db);},update(p,o){const db=ler();for(const k in o)por(db,p+"/"+k,o[k]);gravar(db);},remove(p){const db=ler();por(db,p,null);gravar(db);}};
}
let rede; try{rede=temFirebase?redeFirebase():redeLocal();}catch(e){rede=redeLocal();}

const params=new URLSearchParams(location.search);
const SALA_FONE=(params.get("sala")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
const EH_FONE=SALA_FONE.length===4;
const base=s=>"salas/cc-"+s;

function marcaHTML(tit){const t=TITULOS[tit]||TITULOS.bdsm;return '<div class="marca"><h1 class="sigla">'+t.s+'</h1><span class="extenso">'+esc(t.n)+'</span></div>';}

/* =====================================================================
   TV (anfitrião): é quem embaralha, distribui e decide.
   ===================================================================== */
const CHAVE="bdsm-host-v1";
let h=null, remoto={}, desligar=null, feitos=new Set(), timer=null;

function hostNovo(){
  return {fase:"config",sala:novoCodigo(),titulo:"bdsm",juiz:"rotativo",nomes:"censurado",niveis:{M:true,A:true,S:false,T:true},meta:7,turmaP:"",turmaB:"",
    brancas:[],pretas:[],monteB:[],usadasB:[],monteP:[],usadasP:[],maos:{},pontos:{},nomesCache:{},ordem:[],juizIdx:-1,r:null,historico:[]};
}
function salvar(){guardar(CHAVE,h);}
function jogadores(){
  const j=remoto.jogadores||{};
  return Object.keys(j).map(id=>({id,nome:j[id].nome||"Sem nome",entrou:j[id].entrou||0})).sort((a,b)=>a.entrou-b.entrou);
}
function nomeDe(id){const p=jogadores().find(x=>x.id===id);return p?p.nome:(h.nomesCache[id]||"Alguém");}

function montarBaralho(){
  const B=window.BARALHO, br=[], pr=[];
  B.brancas.forEach((l,i)=>{const n=l[0];if(h.niveis[n])br.push({id:"b"+i,t:l.slice(2)});});
  B.pretas.forEach((l,i)=>{const n=l[0];if(h.niveis[n])pr.push({id:"p"+i,t:l.slice(2)});});
  if(h.niveis.T){
    h.turmaB.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach((t,i)=>br.push({id:"tb"+i,t}));
    h.turmaP.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach((t,i)=>pr.push({id:"tp"+i,t:t.indexOf("___")>=0?t:t.replace(/[.?!]?$/,"")+": ___."}));
  }
  h.brancas=br; h.pretas=pr;
  h.monteB=embaralha(br.map(c=>c.id)); h.usadasB=[]; h.monteP=embaralha(pr.map(c=>c.id)); h.usadasP=[];
}
const textoB=id=>{const c=h.brancas.find(x=>x.id===id);return c?c.t:"";};
const textoP=id=>{const c=h.pretas.find(x=>x.id===id);return c?c.t:"";};
function comprarB(){ if(!h.monteB.length){h.monteB=embaralha(h.usadasB);h.usadasB=[];} return h.monteB.shift(); }
function comprarP(){ if(!h.monteP.length){h.monteP=embaralha(h.usadasP);h.usadasP=[];} return h.monteP.shift(); }
function contarCartas(){
  const n=k=>k==="T"?(h.turmaB.split(/\n/).filter(s=>s.trim()).length):window.BARALHO.brancas.filter(l=>l[0]===k).length;
  const p=k=>k==="T"?(h.turmaP.split(/\n/).filter(s=>s.trim()).length):window.BARALHO.pretas.filter(l=>l[0]===k).length;
  let b=0,q=0; Object.keys(NIVEIS).forEach(k=>{if(h.niveis[k]){b+=n(k);q+=p(k);}}); return {b,q,n,p};
}

function ligarSala(){
  if(desligar) desligar();
  remoto={};
  desligar=rede.ouvir(base(h.sala),v=>{remoto=v||{};processar();desenhar();});
  publicar();
}
function publicar(){
  const r=h.r, js=jogadores();
  const est={fase:h.fase,titulo:h.titulo,juizModo:h.juiz,nomesModo:h.nomes,meta:h.meta,atualizado:Date.now()};
  if(r){
    est.rodada=r.n; est.etapa=r.etapa; est.preta={t:textoP(r.preta),lac:lacunas(textoP(r.preta))}; est.juiz=r.juiz||"";
    est.prontos=r.prontos||{};
    if(r.etapa!=="jogando") est.respostas=r.respostas.map(x=>({k:x.k,ids:x.ids,ts:x.ids.map(textoB)}));
    if(r.etapa==="resultado"||r.etapa==="troca"){ est.vencedores=r.vencedores; if(h.nomes==="aberto") est.vencNomes=r.vencedores.map(k=>nomeDe(r.mapa[k])); }
  }
  if(h.nomes==="aberto"||h.fase==="fim") est.placar=js.map(p=>({id:p.id,nome:p.nome,pts:h.pontos[p.id]||0}));
  if(h.fase==="fim") est.momentos=h.historico.map(x=>({preta:x.preta,ts:x.ts,nome:x.nome}));
  const up={estado:est};
  Object.keys(h.maos).forEach(pid=>{up["maos/"+pid]=h.maos[pid].map(id=>({id,t:textoB(id)}));});
  rede.update(base(h.sala),up);
}

function comecar(){
  rede.remove(base(h.sala)+"/jogadas"); rede.remove(base(h.sala)+"/votos"); rede.remove(base(h.sala)+"/trocas"); rede.remove(base(h.sala)+"/cmd");
  montarBaralho(); h.maos={}; h.pontos={}; h.historico=[]; h.juizIdx=-1; h.r=null;
  jogadores().forEach(p=>{h.nomesCache[p.id]=p.nome;});
  h.fase="jogo"; novaRodada();
}
function novaRodada(){
  const js=jogadores(), n=(h.r?h.r.n:0)+1;
  js.forEach(p=>{ h.nomesCache[p.id]=p.nome; const m=h.maos[p.id]||(h.maos[p.id]=[]); while(m.length<MAO){const c=comprarB(); if(!c)break; m.push(c);} });
  Object.keys(h.maos).forEach(pid=>{ if(!js.find(p=>p.id===pid)){ h.usadasB.push(...h.maos[pid]); delete h.maos[pid]; } });
  let juiz=null;
  if(h.juiz==="rotativo"&&js.length){ h.juizIdx=(h.juizIdx+1)%js.length; juiz=js[h.juizIdx].id; }
  h.r={n,preta:comprarP(),juiz,etapa:"jogando",prontos:{},respostas:[],mapa:{},vencedores:[]};
  salvar(); publicar();
}
function participantes(){ const js=jogadores(); return h.r&&h.r.juiz?js.filter(p=>p.id!==h.r.juiz):js; }
function processar(){
  if(!h||h.fase!=="jogo"||!h.r) return;
  const r=h.r, n=r.n;
  /* comandos */
  const cmd=remoto.cmd||{};
  Object.keys(cmd).forEach(k=>{ if(feitos.has(k)) return; feitos.add(k); rede.remove(base(h.sala)+"/cmd/"+k); if(cmd[k]&&cmd[k].c==="proxima") avancar(); });
  if(r.etapa==="jogando"){
    const jog=(remoto.jogadas||{})[n]||{}, lac=lacunas(textoP(r.preta)); let mudou=false;
    participantes().forEach(p=>{
      const ids=arr(jog[p.id]);
      if(!r.prontos[p.id]&&ids.length===lac&&ids.every(id=>(h.maos[p.id]||[]).indexOf(id)>=0)){ r.prontos[p.id]=ids; mudou=true; }
    });
    if(mudou){ salvar(); publicar(); }
    const part=participantes();
    if(part.length>=2&&part.every(p=>r.prontos[p.id])) irJulgar();
  }else if(r.etapa==="julgando"){
    const votos=(remoto.votos||{})[n]||{};
    if(h.juiz==="rotativo"){ const v=votos[r.juiz]; if(v!=null&&r.respostas.find(x=>x.k===v)) decidir([v]); }
    else{
      const js=jogadores(), validos={};
      js.forEach(p=>{const v=votos[p.id]; if(v!=null&&r.respostas.find(x=>x.k===v)&&r.mapa[v]!==p.id) validos[p.id]=v;});
      r.contagemVotos=Object.keys(validos).length;
      if(js.every(p=>validos[p.id]!=null||!r.respostas.some(x=>r.mapa[x.k]!==p.id))) contarVotos(validos);
    }
  }else if(r.etapa==="troca"){
    const tr=(remoto.trocas||{})[n]||{}; let mudou=false;
    jogadores().forEach(p=>{ if(tr[p.id]&&!r.prontos[p.id]){ r.prontos[p.id]=true; mudou=true; } });
    if(mudou){ salvar(); publicar(); }
    if(jogadores().every(p=>r.prontos[p.id])) aplicarTroca();
  }
}
function irJulgar(){
  const r=h.r, ks=embaralha(Object.keys(r.prontos));
  r.respostas=ks.map((pid,i)=>{ r.mapa[i]=pid; return {k:i,ids:r.prontos[pid]}; });
  r.etapa="julgando"; r.prontos={};
  salvar(); publicar(); desenhar();
}
function contarVotos(validos){
  const c={}; Object.values(validos).forEach(k=>{c[k]=(c[k]||0)+1;});
  const max=Math.max(0,...Object.values(c));
  decidir(max>0?Object.keys(c).filter(k=>c[k]===max).map(Number):[], c);
}
function decidir(ks,contagem){
  const r=h.r; if(r.etapa!=="julgando") return;
  r.vencedores=ks; r.contagem=contagem||null; r.etapa="resultado";
  const pret=textoP(r.preta);
  ks.forEach(k=>{ const pid=r.mapa[k]; h.pontos[pid]=(h.pontos[pid]||0)+1;
    h.historico.push({preta:pret,ts:r.respostas.find(x=>x.k===k).ids.map(textoB),nome:nomeDe(pid)}); });
  /* cartas jogadas saem das mãos */
  r.respostas.forEach(x=>{ const pid=r.mapa[x.k], m=h.maos[pid]||[]; x.ids.forEach(id=>{const i=m.indexOf(id); if(i>=0) m.splice(i,1); h.usadasB.push(id);}); });
  h.usadasP.push(r.preta);
  salvar(); publicar(); desenhar();
}
function avancar(){
  const r=h.r; if(!r) return;
  if(r.etapa==="resultado"){
    const lider=Math.max(0,...Object.values(h.pontos));
    if(h.meta&&lider>=h.meta){ h.fase="fim"; salvar(); publicar(); desenhar(); return; }
    if(r.n%TROCA_CADA===0){
      /* completa as mãos antes da troca, para cada um escolher entre 7 */
      jogadores().forEach(p=>{const m=h.maos[p.id]||(h.maos[p.id]=[]); while(m.length<MAO){const c=comprarB(); if(!c)break; m.push(c);}});
      r.etapa="troca"; r.prontos={}; salvar(); publicar(); desenhar(); return;
    }
    novaRodada(); desenhar();
  }else if(r.etapa==="troca"){ aplicarTroca(); }
}
function aplicarTroca(){
  const r=h.r; if(r.etapa!=="troca") return;
  const tr=(remoto.trocas||{})[r.n]||{}, devolver=[];
  jogadores().forEach(p=>{

function agirTV(a,d){
  switch(a){
    case "titulo": h.titulo=d.v; break;
    case "juiz": h.juiz=d.v; break;
    case "nomes": h.nomes=d.v; break;
    case "meta": h.meta=+d.v; break;
    case "nivel": h.niveis[d.v]=!h.niveis[d.v]; break;
    case "expulsar": rede.remove(base(h.sala)+"/jogadores/"+d.id); rede.remove(base(h.sala)+"/maos/"+d.id); return;
    case "nova-sala": rede.remove(base(h.sala)); h.sala=novoCodigo(); ligarSala(); break;
    case "comecar": comecar(); break;
    case "forcar": if(h.r&&h.r.etapa==="jogando"&&Object.keys(h.r.prontos).length>=2) irJulgar(); return;
    case "tv-escolher": escolherPelaTV(+d.k); return;
    case "proxima": avancar(); return;
    case "encerrar": h.fase="fim"; break;
    case "qr-ver": verQR=!verQR; break;
    case "voltar-config": h.fase="config"; h.r=null; h.maos={}; rede.remove(base(h.sala)+"/maos"); break;
    default: return;
  }
  salvar(); publicar(); desenhar();
}

    return '<section class="bloco"><h2 class="chamada">Recicle sua mão</h2><p class="nota">Toque nas cartas fracas para descartar (até '+TROCA_MAX+' das '+MAO+').'+(descarte.length>=TROCA_MAX?' Limite atingido.':'')+' Elas voltam para o fundo do monte e você recebe novas.</p><div class="mao">'+
      mao.map(c=>'<button class="carta-mao'+(descarte.indexOf(c.id)>=0?" descartar":"")+'" data-a="descartar" data-id="'+c.id+'" aria-pressed="'+(descarte.indexOf(c.id)>=0)+'">'+esc(c.t)+'</button>').join("")+'</div>'+
      '<div class="acoes"><button class="btn" data-a="trocar"'+(descarte.length?"":" disabled")+'>Trocar '+pl(descarte.length,"carta","cartas")+'</button><button class="btn sec" data-a="manter">Manter minha mão</button></div></section>'+pe;
  }
  return pe;
}
let ultimaJogada={n:null,ids:[]};
function jaJogueiEsta(x){ return ultimaJogada.n===(sala&&sala.estado&&sala.estado.rodada)&&arr(x.ids).join()===ultimaJogada.ids.join(); }
function foneClique(b){
  const a=b.dataset.a, est=sala&&sala.estado; if(!est) return;
  const n=est.rodada;
  switch(a){
    case "pegar": { const id=b.dataset.id, i=escolha.indexOf(id), lac=(est.preta||{}).lac||1;
      if(i>=0) escolha.splice(i,1); else { if(escolha.length>=lac) escolha.shift(); escolha.push(id); } break; }
    case "jogar": if(escolha.length===((est.preta||{}).lac||1)){ ultimaJogada={n,ids:escolha.slice()}; guardar(CHAVE_FONE+"-ult",ultimaJogada); enviar("jogadas/"+n+"/"+eu.id,escolha); } break;
    case "voto": escolhaVoto=+b.dataset.k; break;
    case "confirmar-voto": if(escolhaVoto!=null) enviar("votos/"+n+"/"+eu.id,escolhaVoto); break;
    case "descartar": { const id=b.dataset.id,i=descarte.indexOf(id); if(i>=0) descarte.splice(i,1); else if(descarte.length<TROCA_MAX) descarte.push(id); break; }
    case "trocar": enviar("trocas/"+n+"/"+eu.id,{ok:true,ids:descarte}); break;
    case "manter": enviar("trocas/"+n+"/"+eu.id,{ok:true}); break;
    case "proxima": enviar("cmd/"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{c:"proxima",por:eu.id}); b.disabled=true; return;
  }
  desenharFone();
}

/* ---------------- eventos ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  if(EH_FONE) foneClique(b); else agirTV(b.dataset.a,b.dataset);
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="form-entrar"){ const nm=$("#meu-nome").value.trim().slice(0,18); if(!nm) return;
    eu={id:eu.id||novoId(),nome:nm}; guardar(CHAVE_FONE,eu); rede.set(base(SALA_FONE)+"/jogadores/"+eu.id,{nome:nm,entrou:Date.now()}); }
});
document.addEventListener("input",e=>{
  if(EH_FONE) return;
  if(e.target.id==="turmaP"||e.target.id==="turmaB"){ h[e.target.id]=e.target.value; salvar();
    const c=$("#contagem"),cc=contarCartas(); if(c) c.textContent=pl(cc.q,"pergunta","perguntas")+" e "+pl(cc.b,"resposta","respostas")+" no baralho."; }
});
document.addEventListener("change",e=>{ if(!EH_FONE&&(e.target.id==="turmaP"||e.target.id==="turmaB")) desenhar(); });
let trava=null;
function manterTela(){ if(trava||!navigator.wakeLock) return; navigator.wakeLock.request("screen").then(w=>{trava=w;w.addEventListener("release",()=>{trava=null;});}).catch(()=>{}); }
document.addEventListener("click",manterTela);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") manterTela(); });

/* ---------------- início ---------------- */
if(EH_FONE){
  ultimaJogada=abrir(CHAVE_FONE+"-ult")||{n:null,ids:[]};
  desenharFone();
  rede.ouvir(base(SALA_FONE),v=>{sala=v||{};desenharFone();});
}else{
  h=abrir(CHAVE)||hostNovo(); h.titulo="bdsm";
  const b0=hostNovo(); for(const k in b0) if(h[k]===undefined) h[k]=b0[k];
  ligarSala(); desenhar();
}
})();
</script>
