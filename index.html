    ouvir(p,cb){const ref=db.ref(p),f=s=>cb(s.val());ref.on("value",f);return()=>ref.off("value",f);},
    set(p,v){return db.ref(p).set(v);},update(p,o){return db.ref(p).update(o);},remove(p){return db.ref(p).remove();}};
  db.ref(".info/connected").on("value",s=>{r.conectado=!!s.val();desenhar();});
  return r;
}
function redeLocal(){
  const KEY="bdsm-rede-local",ouv=[];let bc=null;try{bc=new BroadcastChannel("bdsm");}catch(e){}
  const ler=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){return {};}};
  const pegar=(db,p)=>p.split("/").reduce((o,k)=>o&&o[k]!==undefined?o[k]:null,db);
  const por=(db,p,v)=>{const ks=p.split("/");let o=db;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=="object"||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}if(v===null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=clone(v);};
  const avisar=()=>{const db=ler();ouv.slice().forEach(l=>l.cb(clone(pegar(db,l.p))));};
  const gravar=db=>{try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}avisar();if(bc)bc.postMessage(1);};
  if(bc)bc.onmessage=avisar; window.addEventListener("storage",e=>{if(e.key===KEY)avisar();});
  return {tipo:"local",conectado:true,
    ouvir(p,cb){const l={p,cb};ouv.push(l);setTimeout(()=>cb(clone(pegar(ler(),p))),0);return()=>{const i=ouv.indexOf(l);if(i>=0)ouv.splice(i,1);};},
    set(p,v){const db=ler();por(db,p,v);gravar(db);},update(p,o){const db=ler();for(const k in o)por(db,p+"/"+k,o[k]);gravar(db);},remove(p){const db=ler();por(db,p,null);gravar(db);}};
}

/* =====================================================================
   TV (anfitrião): é quem embaralha, distribui e decide.

const CHAVE="bdsm-host-v1";
let h=null, remoto={}, desligar=null, feitos=new Set(), timer=null;

function hostNovo(){
  return {fase:"config",sala:novoCodigo(),titulo:"bdsm",juiz:"rotativo",nomes:"censurado",niveis:{M:true,A:true,S:false,T:true},meta:7,turmaP:"",turmaB:"",
    brancas:[],pretas:[],monteB:[],usadasB:[],monteP:[],usadasP:[],maos:{},pontos:{},nomesCache:{},ordem:[],juizIdx:-1,r:null,historico:[]};

function jogadores(){
  const j=remoto.jogadores||{};
  return Object.keys(j).map(id=>({id,nome:j[id].nome||"Sem nome",entrou:j[id].entrou||0})).sort((a,b)=>a.entrou-b.entrou);
}
function nomeDe(id){const p=jogadores().find(x=>x.id===id);return p?p.nome:(h.nomesCache[id]||"Alguém");}

function montarBaralho(){
  const B=window.BARALHO, br=[], pr=[];
  B.brancas.map(ler).forEach(c=>{if(h.niveis[c.nv])br.push({id:"b"+c.n,n:c.n,tp:c.tp,t:c.t});});
  B.pretas.map(ler).forEach(c=>{if(h.niveis[c.nv])pr.push({id:"p"+c.n,n:c.n,tp:c.tp,t:c.t});});
  if(h.niveis.T){
    h.turmaB.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach((t,i)=>br.push({id:"tb"+i,tp:"opasc",t}));
    h.turmaP.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach((t,i)=>pr.push({id:"tp"+i,t:t.indexOf("___")>=0?t:t.replace(/[.?!]?$/,"")+": ___."}));
  }
  h.brancas=br; h.pretas=pr;
  h.monteB=embaralha(br.map(c=>c.id)); h.usadasB=[]; h.monteP=embaralha(pr.map(c=>c.id)); h.usadasP=[];
}
const textoB=id=>{const c=h.brancas.find(x=>x.id===id);return c?c.t:"";};
const textoP=id=>{const c=h.pretas.find(x=>x.id===id);return c?c.t:"";};
/* compra misturando os tipos: procura, entre as próximas cartas do monte,
   uma do tipo que a mão tem menos (objeto, ato, pessoa, situação/conceito) */
const GRUPOS=["o","a","p","sc"];
const cartaB=id=>h.brancas.find(x=>x.id===id);
function comprarB(m){
  if(!h.monteB.length){h.monteB=embaralha(h.usadasB);h.usadasB=[];}
  if(!m||!h.monteB.length) return h.monteB.shift();
  const tem=g=>m.filter(id=>{const c=cartaB(id);return c&&c.tp&&g.indexOf(c.tp[0])>=0;}).length;
  const falta=GRUPOS.slice().sort((x,y)=>tem(x)-tem(y)||Math.random()-.5)[0];
  const j=h.monteB.slice(0,12).findIndex(id=>{const c=cartaB(id);return c&&c.tp&&[...c.tp].some(l=>falta.indexOf(l)>=0);});
  return h.monteB.splice(j>0?j:0,1)[0];
}
function comprarP(){ if(!h.monteP.length){h.monteP=embaralha(h.usadasP);h.usadasP=[];} return h.monteP.shift(); }
function contarCartas(){
  const n=k=>k==="T"?(h.turmaB.split(/\n/).filter(s=>s.trim()).length):window.BARALHO.brancas.filter(l=>ler(l).nv===k).length;
  const p=k=>k==="T"?(h.turmaP.split(/\n/).filter(s=>s.trim()).length):window.BARALHO.pretas.filter(l=>ler(l).nv===k).length;
  let b=0,q=0; Object.keys(NIVEIS).forEach(k=>{if(h.niveis[k]){b+=n(k);q+=p(k);}}); return {b,q,n,p};
}

function ligarSala(){
  if(desligar) desligar();
  remoto={};
  desligar=rede.ouvir(base(h.sala),v=>{remoto=v||{};processar();desenhar();});
  publicar();
}
function publicar(){
  const r=h.r, js=jogadores();
  const est={fase:h.fase,titulo:h.titulo,juizModo:h.juiz,nomesModo:h.nomes,meta:h.meta,atualizado:Date.now()};
  if(r){
    est.rodada=r.n; est.etapa=r.etapa; est.preta={t:textoP(r.preta),lac:lacunas(textoP(r.preta))}; est.juiz=r.juiz||"";
    est.prontos=r.prontos||{};
    if(r.etapa!=="jogando") est.respostas=r.respostas.map(x=>({k:x.k,ids:x.ids,ts:x.ids.map(textoB)}));
    if(r.etapa==="resultado"||r.etapa==="troca"){ est.vencedores=r.vencedores; if(h.nomes==="aberto") est.vencNomes=r.vencedores.map(k=>nomeDe(r.mapa[k])); }
  }
  if(h.nomes==="aberto"||h.fase==="fim") est.placar=js.map(p=>({id:p.id,nome:p.nome,pts:h.pontos[p.id]||0}));
  if(h.fase==="fim") est.momentos=h.historico.map(x=>({preta:x.preta,ts:x.ts,nome:x.nome}));
  const up={estado:est};
  Object.keys(h.maos).forEach(pid=>{up["maos/"+pid]=h.maos[pid].map(id=>{const c=cartaB(id);return {id,t:c?c.t:"",n:c&&c.n||0};});});
  rede.update(base(h.sala),up);
}

function comecar(){
  rede.remove(base(h.sala)+"/jogadas"); rede.remove(base(h.sala)+"/votos"); rede.remove(base(h.sala)+"/trocas"); rede.remove(base(h.sala)+"/cmd");
  montarBaralho(); h.maos={}; h.pontos={}; h.historico=[]; h.juizIdx=-1; h.r=null;
  jogadores().forEach(p=>{h.nomesCache[p.id]=p.nome;});
  h.fase="jogo"; novaRodada();
}
function novaRodada(){
  const js=jogadores(), n=(h.r?h.r.n:0)+1;
  js.forEach(p=>{ h.nomesCache[p.id]=p.nome; const m=h.maos[p.id]||(h.maos[p.id]=[]); while(m.length<MAO){const c=comprarB(m); if(!c)break; m.push(c);} });
  Object.keys(h.maos).forEach(pid=>{ if(!js.find(p=>p.id===pid)){ h.usadasB.push(...h.maos[pid]); delete h.maos[pid]; } });
  let juiz=null;
  if(h.juiz==="rotativo"&&js.length){ h.juizIdx=(h.juizIdx+1)%js.length; juiz=js[h.juizIdx].id; }
  h.r={n,preta:comprarP(),juiz,etapa:"jogando",prontos:{},respostas:[],mapa:{},vencedores:[]};
  salvar(); publicar();
}
function participantes(){ const js=jogadores(); return h.r&&h.r.juiz?js.filter(p=>p.id!==h.r.juiz):js; }
function processar(){
  if(!h||h.fase!=="jogo"||!h.r) return;
  const r=h.r, n=r.n;
  /* comandos */
  const cmd=remoto.cmd||{};
  Object.keys(cmd).forEach(k=>{ if(feitos.has(k)) return; feitos.add(k); rede.remove(base(h.sala)+"/cmd/"+k); if(cmd[k]&&cmd[k].c==="proxima") avancar(); });
  if(r.etapa==="jogando"){
    const jog=(remoto.jogadas||{})[n]||{}, lac=lacunas(textoP(r.preta)); let mudou=false;
    participantes().forEach(p=>{
      const ids=arr(jog[p.id]);
      if(!r.prontos[p.id]&&ids.length===lac&&ids.every(id=>(h.maos[p.id]||[]).indexOf(id)>=0)){ r.prontos[p.id]=ids; mudou=true; }
    });
    if(mudou){ salvar(); publicar(); }
    const part=participantes();
    if(part.length>=2&&part.every(p=>r.prontos[p.id])) irJulgar();
  }else if(r.etapa==="julgando"){
    const votos=(remoto.votos||{})[n]||{};
    if(h.juiz==="rotativo"){ const v=votos[r.juiz]; if(v!=null&&r.respostas.find(x=>x.k===v)) decidir([v]); }
    else{
      const js=jogadores(), validos={};
      js.forEach(p=>{const v=votos[p.id]; if(v!=null&&r.respostas.find(x=>x.k===v)&&r.mapa[v]!==p.id) validos[p.id]=v;});
      r.contagemVotos=Object.keys(validos).length;
      if(js.every(p=>validos[p.id]!=null||!r.respostas.some(x=>r.mapa[x.k]!==p.id))) contarVotos(validos);
    }
  }else if(r.etapa==="troca"){
    const tr=(remoto.trocas||{})[n]||{}; let mudou=false;
    jogadores().forEach(p=>{ if(tr[p.id]&&!r.prontos[p.id]){ r.prontos[p.id]=true; mudou=true; } });
    if(mudou){ salvar(); publicar(); }
    if(jogadores().every(p=>r.prontos[p.id])) aplicarTroca();
  }
}
function irJulgar(){
  const r=h.r, ks=embaralha(Object.keys(r.prontos));
  r.respostas=ks.map((pid,i)=>{ r.mapa[i]=pid; return {k:i,ids:r.prontos[pid]}; });
  r.etapa="julgando"; r.prontos={};
  salvar(); publicar(); desenhar();
}
function contarVotos(validos){
  const c={}; Object.values(validos).forEach(k=>{c[k]=(c[k]||0)+1;});
  const max=Math.max(0,...Object.values(c));
  decidir(max>0?Object.keys(c).filter(k=>c[k]===max).map(Number):[], c);
}
function decidir(ks,contagem){
  const r=h.r; if(r.etapa!=="julgando") return;
  r.vencedores=ks; r.contagem=contagem||null; r.etapa="resultado";
  const pret=textoP(r.preta);
  ks.forEach(k=>{ const pid=r.mapa[k]; h.pontos[pid]=(h.pontos[pid]||0)+1;
    h.historico.push({preta:pret,ts:r.respostas.find(x=>x.k===k).ids.map(textoB),nome:nomeDe(pid)}); });
  /* cartas jogadas saem das mãos */
  r.respostas.forEach(x=>{ const pid=r.mapa[x.k], m=h.maos[pid]||[]; x.ids.forEach(id=>{const i=m.indexOf(id); if(i>=0) m.splice(i,1); h.usadasB.push(id);}); });
  h.usadasP.push(r.preta);
  salvar(); publicar(); desenhar();
}
function avancar(){
  const r=h.r; if(!r) return;
  if(r.etapa==="resultado"){
    const lider=Math.max(0,...Object.values(h.pontos));
    if(h.meta&&lider>=h.meta){ h.fase="fim"; salvar(); publicar(); desenhar(); return; }
    if(r.n%TROCA_CADA===0){
      /* completa as mãos antes da troca, para cada um escolher entre 7 */
      jogadores().forEach(p=>{const m=h.maos[p.id]||(h.maos[p.id]=[]); while(m.length<MAO){const c=comprarB(m); if(!c)break; m.push(c);}});
      r.etapa="troca"; r.prontos={}; salvar(); publicar(); desenhar(); return;
    }
    novaRodada(); desenhar();
  }else if(r.etapa==="troca"){ aplicarTroca(); }
}
function aplicarTroca(){
  const r=h.r; if(r.etapa!=="troca") return;
  const tr=(remoto.trocas||{})[r.n]||{}, devolver=[];
  jogadores().forEach(p=>{
    const m=h.maos[p.id]||[], ids=arr(tr[p.id]&&tr[p.id].ids).filter(id=>m.indexOf(id)>=0).slice(0,TROCA_MAX);
    ids.forEach(id=>{ m.splice(m.indexOf(id),1); devolver.push(id); });
    while(m.length<MAO){const c=comprarB(m); if(!c)break; m.push(c);}
  });
  h.monteB.push(...devolver);
  novaRodada(); desenhar();
}
function escolherPelaTV(k){ if(h.r&&h.r.etapa==="julgando") decidir([k]); }

        const venc=fim&&r.vencedores.indexOf(x.k)>=0, dono=fim&&venc&&h.nomes==="aberto"?nomeDe(r.mapa[x.k]):"";
        const votos=fim&&r.contagem?(r.contagem[x.k]||0):null;
        return '<div class="resposta'+(fim?(venc?" venceu":" perdeu"):"")+'" style="animation-delay:'+(i*180)+'ms"><p class="frase">'+preencher(t,x.ids.map(textoB))+'</p>'+
          '<div class="acoes" style="justify-content:space-between"><span class="letra">'+letra(i)+'</span>'+
          (dono?'<span class="dono">'+esc(dono)+'</span>':(venc?'<span class="dono">Vencedora</span>':''))+(votos!=null?'<span class="nota" style="color:#555">'+pl(votos,"voto","votos")+'</span>':'')+
          (!fim?'<button class="btn sec mini" style="color:#111;border-color:#bbb" data-a="tv-escolher" data-k="'+x.k+'">Escolher pela TV</button>':'')+'</div></div>';
      }).join("")+'</div></section>';
    if(fim){
      const v=r.vencedores;
      corpo+='<section class="vitoria">'+(v.length?(h.nomes==="aberto"?'<p class="quem">'+esc(lista(v.map(k=>nomeDe(r.mapa[k]))))+(v.length>1?" levam":" leva")+' o ponto</p>':'<p class="quem">'+(v.length>1?"Empate: as duas levam ponto":"Essa levou")+'</p><p class="nota">Quem foi? Só no fim da partida.</p>'):'<p class="quem">Ninguém levou</p>')+
        '<div class="acoes"><button class="btn" data-a="proxima">'+(r.n%TROCA_CADA===0?"Abrir a troca de cartas":"Próxima rodada")+'</button></div><p class="nota">Também dá para avançar pelo celular.</p></section>';
    }
  }else if(r.etapa==="troca"){
    corpo='<section class="bloco"><h2 class="chamada">Hora da reciclagem</h2><p class="nota">Cada um marca no celular as cartas fracas (até '+TROCA_MAX+' das '+MAO+') e recebe novas. As descartadas voltam para o fundo do monte. Ninguém é obrigado a trocar.</p>'+
      '<ul class="pessoas">'+js.map(p=>'<li class="pessoa '+(r.prontos[p.id]?"pronto":"espera")+'">'+esc(p.nome)+'</li>').join("")+'</ul>'+
      '<div class="acoes"><button class="btn sec mini" data-a="proxima">Seguir sem esperar</button></div></section>';
  }
  return topoTV('<span class="chip">Rodada '+r.n+'</span><span class="chip">'+h.monteB.length+' no monte</span>')+
    '<main class="bloco" style="gap:20px">'+corpo+'</main><aside class="bloco">'+placarHTML()+
    '<div class="acoes"><button class="btn sec mini" data-a="encerrar">Encerrar a partida</button><button class="btn sec mini" data-a="qr-ver">Entrar mais gente</button></div>'+(verQR?'<div class="painel"><div class="qr" id="qr"></div><span class="endereco">'+esc(urlFone())+'</span><p class="nota">Quem entrar agora recebe a mão na próxima rodada.</p></div>':'')+'</aside>';
}
let verQR=false;
function ranking(){ return jogadores().map(p=>({nome:p.nome,pts:h.pontos[p.id]||0})).sort((a,b)=>b.pts-a.pts); }
function telaFim(){
  const rk=ranking();
  return topoTV()+'<main class="bloco" style="gap:24px"><section class="bloco"><p class="rotulo">Fim da partida'+(h.r?' · '+pl(h.r.n,"rodada","rodadas"):'')+'</p><h2 class="chamada">'+(rk.length&&rk[0].pts?esc(rk[0].nome)+' é a pessoa mais sem moral da mesa':'Ninguém pontuou. Mesa de santos.')+'</h2></section>'+
    '<section class="podio">'+rk.map((p,i)=>'<div><span class="pos">'+(i+1)+'º</span><span class="nm">'+esc(p.nome)+'</span><span>'+pl(p.pts,"ponto","pontos")+'</span></div>').join("")+'</section>'+
    (h.historico.length?'<section class="painel"><p class="rotulo">Melhores momentos'+(h.nomes==="censurado"?' · agora com os autores':'')+'</p><ul class="momentos">'+h.historico.map(x=>'<li><p class="frase">'+preencher(x.preta,x.ts)+'</p><span class="de">'+esc(x.nome)+'</span></li>').join("")+'</ul></section>':'')+
    '<section class="acoes"><button class="btn" data-a="voltar-config">Nova partida</button></section></main>';
}
function desenhar(){
  if(EH_FONE){desenharFone();return;}
  const app=$("#app"), foco=document.activeElement&&document.activeElement.id, sel=foco&&document.activeElement.selectionStart;
  if(h.fase==="config"){ app.className="app"; app.innerHTML=telaConfig(); }
  else if(h.fase==="fim"){ app.className="app"; app.innerHTML=telaFim(); }
  else if(h.r){ app.className="app tv-jogo"; app.innerHTML=telaJogo(); }
  document.title=TITULOS[h.titulo].txt;
  const qr=$("#qr"); if(qr&&window.QRCode){try{new QRCode(qr,{text:urlFone(),width:180,height:180,correctLevel:QRCode.CorrectLevel.M});}catch(e){}} else if(qr) qr.innerHTML='<b style="color:#111;font-size:28px">'+h.sala+'</b>';
  if(foco){const el=document.getElementById(foco);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
}
function agirTV(a,d){
  switch(a){
    case "titulo": h.titulo=d.v; break;
    case "juiz": h.juiz=d.v; break;
    case "nomes": h.nomes=d.v; break;
    case "meta": h.meta=+d.v; break;
    case "nivel": h.niveis[d.v]=!h.niveis[d.v]; break;
    case "expulsar": rede.remove(base(h.sala)+"/jogadores/"+d.id); rede.remove(base(h.sala)+"/maos/"+d.id); return;
    case "nova-sala": rede.remove(base(h.sala)); h.sala=novoCodigo(); ligarSala(); break;
    case "comecar": comecar(); break;
    case "forcar": if(h.r&&h.r.etapa==="jogando"&&Object.keys(h.r.prontos).length>=2) irJulgar(); return;
    case "tv-escolher": escolherPelaTV(+d.k); return;
    case "proxima": avancar(); return;
    case "encerrar": h.fase="fim"; break;
    case "qr-ver": verQR=!verQR; break;
    case "voltar-config": h.fase="config"; h.r=null; h.maos={}; rede.remove(base(h.sala)+"/maos"); break;
    default: return;
  }
  salvar(); publicar(); desenhar();
}

/* =====================================================================
   CELULAR
   ===================================================================== */
const CHAVE_FONE="bdsm-fone-"+SALA_FONE;
let eu=abrir(CHAVE_FONE)||{id:null,nome:""}, sala=null, escolha=[], descarte=[], escolhaVoto=null, rodadaEscolha=null;
function enviar(caminho,valor){ rede.set(base(SALA_FONE)+"/"+caminho,valor); }
function desenharFone(){
  const app=$("#app"); app.className="app fone";
  const foco=document.activeElement&&document.activeElement.id, val=foco==="meu-nome"?document.activeElement.value:null;
  const s=sala, est=s&&s.estado;
  document.title=est?TITULOS[est.titulo||"bdsm"].txt:"B.D.S.M.";
  let corpo;
  if(s===null) corpo='<p class="nota">Procurando a sala '+esc(SALA_FONE)+'…</p>';
  else if(!est) corpo='<section class="bloco"><h2 class="chamada">Sala '+esc(SALA_FONE)+' não encontrada</h2><p class="nota">Confira o código na TV ou leia o QR Code de novo.</p></section>';
  else if(!eu.id||!(s.jogadores&&s.jogadores[eu.id])) corpo='<section class="bloco"><p class="rotulo">Sala '+esc(SALA_FONE)+'</p><h2 class="chamada">'+(eu.id?"Você saiu da mesa. Volta?":"Como a turma te chama?")+'</h2><form class="linha-form" id="form-entrar"><input type="text" id="meu-nome" maxlength="18" value="'+esc(eu.nome)+'" placeholder="Seu nome" aria-label="Seu nome" autocomplete="off" required><button class="btn" type="submit">Sentar</button></form></section>';
  else corpo=corpoFone(s,est);
  app.innerHTML='<header class="topo">'+marcaHTML(est?est.titulo:"bdsm")+'<div class="chips"><span class="chip quente">Sala '+esc(SALA_FONE)+'</span>'+(eu.nome?'<span class="chip">'+esc(eu.nome)+'</span>':'')+'</div></header><main class="bloco" style="gap:18px">'+corpo+'</main>';
  if(foco){const el=document.getElementById(foco);if(el){if(val!=null)el.value=val;el.focus();}}
}
function corpoFone(s,est){
  if(est.fase==="config") return '<section class="bloco"><h2 class="chamada">Você está na mesa</h2><p class="nota">Espere a TV distribuir as cartas.</p></section>';
  if(est.fase==="fim"){
    const rk=(est.placar||[]).slice().sort((a,b)=>b.pts-a.pts);
    return '<section class="bloco"><h2 class="chamada">Fim da partida</h2><ul class="placar">'+rk.map((p,i)=>'<li class="'+(i===0?"lider":"")+'"><span>'+(i+1)+'º '+esc(p.nome)+'</span><b>'+p.pts+'</b></li>').join("")+'</ul><p class="nota">Os melhores momentos, com os autores, estão na TV.</p></section>';
  }
  const n=est.rodada, mao=arr((s.maos||{})[eu.id]), pret=est.preta||{t:"",lac:1};
  if(rodadaEscolha!==n+est.etapa){ rodadaEscolha=n+est.etapa; escolha=[]; descarte=[]; escolhaVoto=null; }
  const placarMeu=est.placar?(est.placar.find(p=>p.id===eu.id)||{}).pts||0:null;
  const pe='<p class="nota">'+(placarMeu!=null?'Você tem '+pl(placarMeu,"ponto","pontos")+'. ':'Placar secreto até o fim. ')+'Rodada '+n+'.</p>';
  const preta='<div class="preta"><p class="t">'+preencher(pret.t,null)+'</p></div>';
  if(est.etapa==="jogando"){
    if(est.juiz===eu.id) return preta+'<section class="bloco"><h2 class="chamada">Você é o juiz</h2><p class="nota">Espere as respostas. Quando chegarem, você escolhe a melhor aqui.</p></section>'+pe;
    const jaFoi=est.prontos&&est.prontos[eu.id];
    if(jaFoi) return preta+'<section class="bloco"><h2 class="chamada">Resposta enviada</h2><p class="nota">Esperando o resto da mesa.</p></section>'+pe;
    const txt=id=>{const c=mao.find(x=>x.id===id);return c?c.t:"";};
    return preta+
      '<section class="bloco"><p class="rotulo">'+(pret.lac>1?"Escolha "+pret.lac+" cartas, na ordem":"Escolha sua carta")+'</p><div class="mao">'+mao.map(c=>{const i=escolha.indexOf(c.id);
        return '<button class="carta-mao" data-a="pegar" data-id="'+c.id+'" aria-pressed="'+(i>=0)+'">'+esc(c.t)+(c.n?'<span class="num">#'+c.n+'</span>':'')+(i>=0&&pret.lac>1?'<span class="n">'+(i+1)+'</span>':'')+'</button>';}).join("")+'</div>'+
      (escolha.length?'<p class="rotulo">Vai ficar assim</p><p class="previa">'+preencher(pret.t,escolha.map(txt))+'</p>':'')+
      '<button class="btn largo" data-a="jogar"'+(escolha.length===pret.lac?"":" disabled")+'>Jogar na mesa</button></section>'+pe;
  }
  if(est.etapa==="julgando"){
    const resp=arr(est.respostas), meus=(est.prontos||{})[eu.id];
    const minha=x=>arr(x.ids).some(id=>mao.find(c=>c.id===id))||false;
    const votado=((s.votos||{})[n]||{})[eu.id];
    if(est.juizModo==="rotativo"&&est.juiz!==eu.id) return preta+'<section class="bloco"><h2 class="chamada">O juiz está escolhendo</h2><p class="nota">Olha a TV.</p></section>'+pe;
    if(votado!=null) return preta+'<section class="bloco"><h2 class="chamada">Voto registrado</h2><p class="nota">Esperando o resto da mesa.</p></section>'+pe;
    return preta+'<section class="bloco"><p class="rotulo">'+(est.juizModo==="rotativo"?"Você é o juiz: escolha a melhor":"Vote na melhor (a sua não vale)")+'</p><div class="mao">'+
      resp.map(x=>{const propria=est.juizModo==="popular"&&jaJogueiEsta(x);
        return '<button class="resposta" data-a="voto" data-k="'+x.k+'" aria-pressed="'+(escolhaVoto===x.k)+'"'+(propria?' disabled style="opacity:.4"':'')+'><span class="frase">'+preencher(pret.t,arr(x.ts))+'</span>'+(propria?'<span class="nota" style="color:#555">Essa é a sua</span>':'')+'</button>';}).join("")+'</div>'+
      '<button class="btn largo" data-a="confirmar-voto"'+(escolhaVoto==null?" disabled":"")+'>Confirmar</button></section>'+pe;
  }
  if(est.etapa==="resultado"){
    const resp=arr(est.respostas), v=arr(est.vencedores), nomes=arr(est.vencNomes);
    return '<section class="bloco"><p class="rotulo">Resultado</p>'+(v.length?v.map(k=>{const x=resp.find(r=>r.k===k);return '<div class="resposta venceu"><p class="frase">'+preencher(pret.t,arr(x&&x.ts))+'</p></div>';}).join(""):'<p class="nota">Ninguém levou.</p>')+
      (nomes.length?'<p class="chamada" style="color:var(--quente)">'+esc(lista(nomes))+(nomes.length>1?" levam":" leva")+'</p>':'<p class="nota">Autor secreto até o fim.</p>')+
      '<button class="btn largo sec" data-a="proxima">'+(n%TROCA_CADA===0?"Abrir a troca de cartas":"Próxima rodada")+'</button></section>'+pe;
  }
  if(est.etapa==="troca"){
    const feito=est.prontos&&est.prontos[eu.id];
    if(feito) return '<section class="bloco"><h2 class="chamada">Troca feita</h2><p class="nota">Esperando o resto da mesa.</p></section>'+pe;
    return '<section class="bloco"><h2 class="chamada">Recicle sua mão</h2><p class="nota">Toque nas cartas fracas para descartar (até '+TROCA_MAX+' das '+MAO+').'+(descarte.length>=TROCA_MAX?' Limite atingido.':'')+' Elas voltam para o fundo do monte e você recebe novas.</p><div class="mao">'+
      mao.map(c=>'<button class="carta-mao'+(descarte.indexOf(c.id)>=0?" descartar":"")+'" data-a="descartar" data-id="'+c.id+'" aria-pressed="'+(descarte.indexOf(c.id)>=0)+'">'+esc(c.t)+'</button>').join("")+'</div>'+
      '<div class="acoes"><button class="btn" data-a="trocar"'+(descarte.length?"":" disabled")+'>Trocar '+pl(descarte.length,"carta","cartas")+'</button><button class="btn sec" data-a="manter">Manter minha mão</button></div></section>'+pe;
  }
  return pe;
}
let ultimaJogada={n:null,ids:[]};
function jaJogueiEsta(x){ return ultimaJogada.n===(sala&&sala.estado&&sala.estado.rodada)&&arr(x.ids).join()===ultimaJogada.ids.join(); }
function foneClique(b){
  const a=b.dataset.a, est=sala&&sala.estado; if(!est) return;
  const n=est.rodada;
  switch(a){
    case "pegar": { const id=b.dataset.id, i=escolha.indexOf(id), lac=(est.preta||{}).lac||1;
      if(i>=0) escolha.splice(i,1); else { if(escolha.length>=lac) escolha.shift(); escolha.push(id); } break; }
    case "jogar": if(escolha.length===((est.preta||{}).lac||1)){ ultimaJogada={n,ids:escolha.slice()}; guardar(CHAVE_FONE+"-ult",ultimaJogada); enviar("jogadas/"+n+"/"+eu.id,escolha); } break;
    case "voto": escolhaVoto=+b.dataset.k; break;
    case "confirmar-voto": if(escolhaVoto!=null) enviar("votos/"+n+"/"+eu.id,escolhaVoto); break;
    case "descartar": { const id=b.dataset.id,i=descarte.indexOf(id); if(i>=0) descarte.splice(i,1); else if(descarte.length<TROCA_MAX) descarte.push(id); break; }
    case "trocar": enviar("trocas/"+n+"/"+eu.id,{ok:true,ids:descarte}); break;
    case "manter": enviar("trocas/"+n+"/"+eu.id,{ok:true}); break;
    case "proxima": enviar("cmd/"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{c:"proxima",por:eu.id}); b.disabled=true; return;
  }
  desenharFone();
}

/* ---------------- eventos ---------------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  if(EH_FONE) foneClique(b); else agirTV(b.dataset.a,b.dataset);
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="form-entrar"){ const nm=$("#meu-nome").value.trim().slice(0,18); if(!nm) return;
    eu={id:eu.id||novoId(),nome:nm}; guardar(CHAVE_FONE,eu); rede.set(base(SALA_FONE)+"/jogadores/"+eu.id,{nome:nm,entrou:Date.now()}); }
});
document.addEventListener("input",e=>{
  if(EH_FONE) return;
  if(e.target.id==="turmaP"||e.target.id==="turmaB"){ h[e.target.id]=e.target.value; salvar();
    const c=$("#contagem"),cc=contarCartas(); if(c) c.textContent=pl(cc.q,"pergunta","perguntas")+" e "+pl(cc.b,"resposta","respostas")+" no baralho."; }
});
document.addEventListener("change",e=>{ if(!EH_FONE&&(e.target.id==="turmaP"||e.target.id==="turmaB")) desenhar(); });
let trava=null;
function manterTela(){ if(trava||!navigator.wakeLock) return; navigator.wakeLock.request("screen").then(w=>{trava=w;w.addEventListener("release",()=>{trava=null;});}).catch(()=>{}); }
document.addEventListener("click",manterTela);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") manterTela(); });

/* ---------------- início ---------------- */
if(EH_FONE){
  ultimaJogada=abrir(CHAVE_FONE+"-ult")||{n:null,ids:[]};
  desenharFone();
  rede.ouvir(base(SALA_FONE),v=>{sala=v||{};desenharFone();});
}else{
  h=abrir(CHAVE)||hostNovo(); h.titulo="bdsm";
  const b0=hostNovo(); for(const k in b0) if(h[k]===undefined) h[k]=b0[k];
  ligarSala(); desenhar();
}
})();
</script>
