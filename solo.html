const abrir=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const lacunas=t=>Math.max(1,t.split("___").length-1);
const ler=l=>{const f=l.split("|");return {n:+f[0],nv:f[1],tp:f[2],th:f[3]?f[3].split(","):[],t:f.slice(4).join("|")};};
const BR={},PR={};
window.BARALHO.brancas.map(ler).forEach(c=>BR[c.n]=c);
window.BARALHO.pretas.map(ler).forEach(c=>{c.slots=c.tp.split("/");PR[c.n]=c;});

function ajustar(resp,antes){
  let r=resp.trim().replace(/\.$/,"");
  const fim=antes.replace(/\s+$/,"");
  const inicioFrase=!fim||/[.?!"“:]$/.test(fim)&&!/:$/.test(fim)||/"$/.test(fim);
  const prim=r.split(" ")[0]||"";
  if(!inicioFrase&&/^[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-záéíóúâêôãõç-]*,?$/.test(prim)&&["Mercúrio"].indexOf(prim)<0) r=r[0].toLowerCase()+r.slice(1);
  return r;
}
function preencher(preta,textos){
  const partes=preta.split("___"); let h="";
  partes.forEach((p,i)=>{ h+=esc(p);
    if(i<partes.length-1){const t=textos&&textos[i]; h+=t!=null?'<mark>'+esc(ajustar(t,partes.slice(0,i+1).join("")))+'</mark>':'<span class="lacuna"></span>';}});
  return h;
}
const encaixa=(n,slot)=>[...BR[n].tp].some(l=>slot.indexOf(l)>=0);
const tipoTxt=n=>[...BR[n].tp].map(l=>TIPOS[l]).join(" / ");

/* ---------- estado ---------- */
let g=abrir(CHAVE);
let marc=abrir(CHAVE_MARC)||[];
let ui={escolha:[],livre:false,descarte:[]};
function novo(){ return {fase:"config",nome:"Você",niveis:{M:true,A:true,S:false},meta:7,qtdBots:3,livre:false,
  monteB:[],usadasB:[],monteP:[],usadasP:[],maos:{},pontos:{},r:null,historico:[]}; }
if(!g) g=novo();
const salvar=()=>guardar(CHAVE,g);
const jogadores=()=>["voce"].concat(BOTS.slice(0,g.qtdBots).map(b=>b.id));
const bot=id=>BOTS.find(b=>b.id===id);
const nome=id=>id==="voce"?g.nome:bot(id).nome;

function montar(){
  const br=Object.values(BR).filter(c=>g.niveis[c.nv]).map(c=>c.n);
  const pr=Object.values(PR).filter(c=>g.niveis[c.nv]).map(c=>c.n);
  g.monteB=embaralha(br); g.usadasB=[]; g.monteP=embaralha(pr); g.usadasP=[];
}
const GRUPOS=["o","a","p","sc"];
function comprarB(m){
  if(!g.monteB.length){g.monteB=embaralha(g.usadasB);g.usadasB=[];}
  if(!g.monteB.length) return null;
  const tem=gr=>m.filter(n=>gr.indexOf(BR[n].tp[0])>=0).length;
  const falta=GRUPOS.slice().sort((x,y)=>tem(x)-tem(y)||Math.random()-.5)[0];
  const j=g.monteB.slice(0,12).findIndex(n=>[...BR[n].tp].some(l=>falta.indexOf(l)>=0));
  return g.monteB.splice(j>0?j:0,1)[0];
}
function comprarP(){ if(!g.monteP.length){g.monteP=embaralha(g.usadasP);g.usadasP=[];} return g.monteP.shift(); }
function completar(){ jogadores().forEach(id=>{const m=g.maos[id]||(g.maos[id]=[]); while(m.length<MAO){const c=comprarB(m); if(c==null)break; m.push(c);} }); }

function comecar(){
  montar(); g.maos={}; g.pontos={}; g.historico=[]; g.r=null;
  jogadores().forEach(id=>g.pontos[id]=0);
  g.fase="jogo"; novaRodada();
}
function novaRodada(){
  completar();
  const n=(g.r?g.r.n:0)+1, p=comprarP();
  const outros=jogadores().slice(1), fb=bot(outros[sorte(outros.length)]);
  g.r={n,preta:p,etapa:"jogando",respostas:[],venc:null,fala:{id:fb.id,t:fb.falas[sorte(fb.falas.length)]}};
  ui={escolha:[],livre:g.livre,descarte:[]};
  salvar(); desenhar();
}

/* os bots escolhem: encaixe + gosto pelo tema + gosto pelo nível + sorte */
function jogadaBot(id){
  const b=bot(id), m=g.maos[id], P=PR[g.r.preta], usadas=[];
  return P.slots.map(slot=>{
    let melhor=null,nota=-1;
    m.forEach(n=>{ if(usadas.indexOf(n)>=0) return; const c=BR[n];
      let s=(encaixa(n,slot)?6:0)+(b.nivel[c.nv]||0)+c.th.filter(t=>b.gosta.indexOf(t)>=0).length*1.5+Math.random()*(b.id==="sorteio"?12:3);
      if(s>nota){nota=s;melhor=n;} });
    usadas.push(melhor); return melhor;
  });
}
function jogar(){
  const P=PR[g.r.preta]; if(ui.escolha.length!==P.slots.length) return;
  const resp=[{de:"voce",ids:ui.escolha.slice()}];
  jogadores().slice(1).forEach(id=>resp.push({de:id,ids:jogadaBot(id)}));
  resp.forEach(x=>{ g.maos[x.de]=g.maos[x.de].filter(n=>x.ids.indexOf(n)<0); g.usadasB.push(...x.ids); });
  g.r.respostas=embaralha(resp); g.r.etapa="julgando"; ui.escolha=[];
  salvar(); desenhar(); window.scrollTo({top:0,behavior:"smooth"});
}
function julgar(i){
  const r=g.r, x=r.respostas[i]; r.venc=i; r.etapa="resultado";
  g.pontos[x.de]=(g.pontos[x.de]||0)+1;
  g.historico.push({preta:r.preta,ids:x.ids,de:x.de});
  g.usadasP.push(r.preta);
  salvar(); desenhar();
}
function vencedor(){ return g.meta?jogadores().find(id=>g.pontos[id]>=g.meta):null; }
function proxima(){
  if(vencedor()){ g.fase="fim"; salvar(); desenhar(); return; }
  if(g.r.n%TROCA_CADA===0){
    completar();
    jogadores().slice(1).forEach(trocaBot);
    g.r.etapa="troca"; ui.descarte=[]; salvar(); desenhar(); return;
  }
  novaRodada();
}
function trocaBot(id){
  const b=bot(id), m=g.maos[id];
  const nota=n=>{const c=BR[n];return (b.nivel[c.nv]||0)+c.th.filter(t=>b.gosta.indexOf(t)>=0).length*1.5+Math.random()*2;};
  const fora=m.slice().sort((x,y)=>nota(x)-nota(y)).slice(0,3);
  trocar(id,fora);
}
function trocar(id,fora){
  const m=g.maos[id]; g.maos[id]=m.filter(n=>fora.indexOf(n)<0);
  completar(); g.monteB.push(...embaralha(fora.slice()));
}

/* ---------- cartas marcadas (as que não encaixaram) ---------- */
function alternarMarca(n,p){
  const i=marc.findIndex(x=>x.n===n&&x.p===p);
  if(i>=0) marc.splice(i,1); else marc.push({n,p});
  guardar(CHAVE_MARC,marc); desenhar();
}
const marcada=(n,p)=>marc.some(x=>x.n===n&&x.p===p);
function textoMarcadas(){
  return marc.map(x=>"#"+x.n+" "+BR[x.n].t+" (na pergunta "+x.p+": "+PR[x.p].t+")").join("\n");
}

/* ---------- desenho ---------- */
const marca='<div class="marca"><h1 class="sigla">B<i>.</i>D<i>.</i>S<i>.</i>M<i>.</i></h1><span class="extenso">Solo</span></div>';
const icone=aberto=>'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/>'+(aberto?'<path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/>':'<path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>')+'</svg>';
const seg=(acao,val,opcoes)=>'<div class="seg">'+opcoes.map(o=>'<button data-a="'+acao+'" data-v="'+o[0]+'" aria-pressed="'+(String(val)===String(o[0]))+'">'+esc(o[1])+'</button>').join("")+'</div>';

function placarHTML(){
  return '<div class="bots">'+jogadores().map(id=>{const b=bot(id);
    return '<span class="bot'+(id==="voce"?" voce":"")+'"><span class="av">'+(id==="voce"?esc((g.nome||"V")[0].toUpperCase()):b.av)+'</span>'+esc(nome(id))+' <b>'+(g.pontos[id]||0)+'</b></span>';}).join("")+'</div>';
}
function pretaHTML(textos,rod){
  const P=PR[g.r.preta];
  return '<div class="preta"><p class="t">'+preencher(P.t,textos)+'</p><div class="rod"><span>Rodada '+g.r.n+(g.meta?' · até '+g.meta:'')+'</span><span>#'+P.n+(rod?' · '+rod:'')+'</span></div></div>';
}

function telaConfig(){
  const qt=Object.keys(NIVEIS).reduce((s,k)=>s+(g.niveis[k]?Object.values(BR).filter(c=>c.nv===k).length:0),0);
  return '<section class="bloco"><h2 class="chamada">Você joga. Você julga. Os bots só fazem vergonha.</h2>'+
  '<p class="nota">Três bots com personalidade jogam com você. A cada rodada todo mundo completa a frase, e você escolhe a melhor, inclusive a sua, se tiver coragem.</p></section>'+
  '<section class="painel"><p class="rotulo">Seu nome</p><input type="text" id="nome" maxlength="18" value="'+esc(g.nome)+'" aria-label="Seu nome" autocomplete="off"></section>'+
  '<section class="painel"><p class="rotulo">Níveis de acidez</p><div class="seg">'+Object.keys(NIVEIS).map(k=>'<button data-a="nivel" data-v="'+k+'" aria-pressed="'+!!g.niveis[k]+'">'+NIVEIS[k]+'</button>').join("")+'</div><p class="nota">'+qt+' respostas no baralho.</p></section>'+
  '<section class="painel"><p class="rotulo">Bots na mesa</p>'+seg("bots",g.qtdBots,[[2,"2"],[3,"3"],[4,"4"]])+
  '<p class="nota">'+BOTS.slice(0,g.qtdBots).map(b=>'<b>'+esc(b.nome)+'</b>').join(", ")+'.</p></section>'+
  '<section class="painel"><p class="rotulo">Partida até</p>'+seg("meta",g.meta,[[5,"5 pontos"],[7,"7 pontos"],[10,"10 pontos"],[0,"Sem limite"]])+'</section>'+
  '<section class="painel"><p class="rotulo">Sua mão</p>'+seg("livre",g.livre?1:0,[[0,"Só as que encaixam"],[1,"Livre: qualquer carta"]])+
  '<p class="nota">As cartas têm etiquetas (objeto, ato, pessoa, situação, conceito). No modo travado, só dá para jogar as que combinam com a lacuna. Dá para destravar a qualquer momento pelo cadeado.</p></section>'+
  (marc.length?telaMarcadas():'')+
  '<div class="acoes"><button class="btn largo" data-a="comecar"'+(qt<40?' disabled':'')+'>Embaralhar e jogar</button></div>';
}
function telaMarcadas(){
  return '<section class="painel"><p class="rotulo">Cartas que não encaixaram ('+marc.length+')</p>'+
  '<ul class="marcadas">'+marc.map(x=>'<li><span><b>#'+x.n+'</b> '+esc(BR[x.n].t)+' <span class="nota">na pergunta #'+x.p+'</span></span><button class="x" data-a="desmarcar" data-n="'+x.n+'" data-p="'+x.p+'" aria-label="Tirar da lista">tirar</button></li>').join("")+'</ul>'+
  '<div class="acoes"><button class="btn mini" data-a="copiar">Copiar lista</button><button class="btn mini sec" data-a="limpar-marcas">Limpar</button></div></section>';
}
function telaJogando(){
  const P=PR[g.r.preta], m=g.maos.voce, q=P.slots.length, slot=P.slots[Math.min(ui.escolha.length,q-1)];
  const textos=ui.escolha.map(n=>BR[n].t);
  const nenhuma=!ui.livre&&!m.some(n=>ui.escolha.indexOf(n)<0&&encaixa(n,slot))&&ui.escolha.length<q;
  if(nenhuma) ui.livre=true;
  return placarHTML()+pretaHTML(null,"aceita "+P.slots.map(s=>s.length>=5?"tudo":[...s].map(l=>TIPOS[l]).join(", ")).join(" | "))+
  '<p class="fala"><b>'+esc(bot(g.r.fala.id).nome)+':</b> '+esc(g.r.fala.t)+'</p>'+
  '<section class="bloco"><div class="cabeca-mao"><p class="rotulo">'+(q>1?'Escolha '+q+' cartas, na ordem':'Escolha sua carta')+'</p>'+
  '<button class="cadeado" data-a="cadeado" aria-pressed="'+ui.livre+'">'+icone(ui.livre)+(ui.livre?'Mão livre':'Só as que encaixam')+'</button></div>'+
  (nenhuma?'<p class="aviso">Nenhuma carta da sua mão encaixa nessa lacuna, então a mão foi destravada.</p>':'')+
  '<div class="mao">'+m.map(n=>{const i=ui.escolha.indexOf(n), ok=ui.livre||i>=0||encaixa(n,slot);
    return '<button class="carta-mao'+(ok?'':' fora')+'" data-a="pegar" data-n="'+n+'" aria-pressed="'+(i>=0)+'"'+(ok?'':' disabled')+'>'+esc(BR[n].t)+(i>=0&&q>1?'<span class="n">'+(i+1)+'</span>':'')+'<span class="num">#'+n+'</span><span class="tipo">'+esc(tipoTxt(n))+'</span></button>';}).join("")+'</div></section>'+
  '<section class="bloco"><p class="rotulo">Vai ficar assim</p><div class="previa">'+preencher(P.t,textos)+'</div>'+
  '<button class="btn largo" data-a="jogar"'+(ui.escolha.length===q?'':' disabled')+'>Jogar na mesa</button></section>'+
  '<div class="acoes"><button class="btn mini sec" data-a="encerrar">Encerrar partida</button></div>';
}
function telaJulgando(){
  const P=PR[g.r.preta];
  return placarHTML()+pretaHTML(null)+
  '<section class="bloco"><p class="rotulo">Agora você é o juiz. Qual é a pior (melhor)?</p>'+
  '<div class="respostas">'+g.r.respostas.map((x,i)=>'<button class="resposta" data-a="julgar" data-i="'+i+'"><span class="frase">'+preencher(P.t,x.ids.map(n=>BR[n].t))+'</span><span class="letra">'+"ABCDE"[i]+'</span></button>').join("")+'</div>'+
  '<p class="nota">Os nomes só aparecem depois do veredito. Você sabe qual é a sua, mas ninguém está olhando.</p></section>';
}
function telaResultado(){
  const P=PR[g.r.preta], r=g.r, v=r.respostas[r.venc];
  const venceu=vencedor();
  return placarHTML()+
  '<section class="vitoria"><p class="rotulo">Rodada '+r.n+'</p><p class="quem">'+(v.de==="voce"?'Ponto seu!':'Ponto para '+esc(nome(v.de)))+'</p></section>'+
  '<div class="respostas">'+r.respostas.map((x,i)=>'<div class="resposta'+(i===r.venc?' venceu':' perdeu')+'" style="'+(i===r.venc?'':'opacity:.62')+'"><p class="frase">'+preencher(P.t,x.ids.map(n=>BR[n].t))+'</p>'+
    '<div class="rodape-r"><span class="quem-foi'+(x.de==="voce"?' voce':'')+'">'+esc(nome(x.de))+'</span>'+
    x.ids.map(n=>'<button class="marcar" data-a="marcar" data-n="'+n+'" data-p="'+P.n+'" aria-pressed="'+marcada(n,P.n)+'" title="Marcar carta que não encaixou">#'+n+(marcada(n,P.n)?' marcada':' não encaixou')+'</button>').join("")+'</div></div>').join("")+'</div>'+
  '<p class="nota">Achou uma carta que não combinou com a pergunta? Toque no número dela. A lista fica guardada na tela inicial para você ajustar depois.</p>'+
  '<button class="btn largo" data-a="proxima">'+(venceu?'Ver o resultado final':(r.n%TROCA_CADA===0?'Reciclar cartas':'Próxima rodada'))+'</button>';
}
function telaTroca(){
  const m=g.maos.voce;
  return placarHTML()+'<section class="bloco"><p class="rotulo">Reciclagem</p><h2 class="chamada">Troque até '+TROCA_MAX+' cartas</h2>'+
  '<p class="nota">Os bots já trocaram as deles. Toque nas cartas que quer mandar para o fundo do monte.</p>'+
  '<div class="mao">'+m.map(n=>'<button class="carta-mao'+(ui.descarte.indexOf(n)>=0?' descartar':'')+'" data-a="descartar" data-n="'+n+'" aria-pressed="'+(ui.descarte.indexOf(n)>=0)+'">'+esc(BR[n].t)+'<span class="num">#'+n+'</span><span class="tipo">'+esc(tipoTxt(n))+'</span></button>').join("")+'</div>'+
  '<div class="acoes"><button class="btn" data-a="trocar"'+(ui.descarte.length?'':' disabled')+'>Trocar '+ui.descarte.length+'</button><button class="btn sec" data-a="manter">Manter a mão</button></div></section>';
}
function telaFim(){
  const ord=jogadores().slice().sort((a,b)=>(g.pontos[b]||0)-(g.pontos[a]||0));
  return '<section class="bloco"><p class="rotulo">Fim de jogo</p><h2 class="chamada">'+(ord[0]==="voce"?'Você venceu. Parabéns, eu acho.':esc(nome(ord[0]))+' venceu. Que vergonha.')+'</h2></section>'+
  '<div class="podio">'+ord.map((id,i)=>'<div><span class="pos">'+(i+1)+'º</span><span class="nm">'+esc(nome(id))+'</span><span>'+(g.pontos[id]||0)+' pontos</span></div>').join("")+'</div>'+
  (g.historico.length?'<section class="painel"><p class="rotulo">Melhores momentos</p><ul class="momentos">'+g.historico.map(x=>'<li><span class="frase">'+preencher(PR[x.preta].t,x.ids.map(n=>BR[n].t))+'</span><span class="de">'+esc(nome(x.de))+'</span></li>').join("")+'</ul></section>':'')+
  (marc.length?telaMarcadas():'')+
  '<div class="acoes"><button class="btn" data-a="revanche">Revanche</button><button class="btn sec" data-a="config">Mudar ajustes</button></div>';
}
function desenhar(){
  let c;
  if(g.fase==="config") c=telaConfig();
  else if(g.fase==="fim") c=telaFim();
  else if(g.r.etapa==="jogando") c=telaJogando();
  else if(g.r.etapa==="julgando") c=telaJulgando();
  else if(g.r.etapa==="resultado") c=telaResultado();
  else c=telaTroca();
  $("#app").innerHTML='<header class="topo">'+marca+'<span class="chip quente">+18</span></header><main class="mesa-solo">'+c+'</main>';
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.disabled) return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==="nivel"){ g.niveis[v]=!g.niveis[v]; }
  else if(a==="bots") g.qtdBots=+v;
  else if(a==="meta") g.meta=+v;
  else if(a==="livre") g.livre=v==="1";
  else if(a==="comecar"||a==="revanche"){ comecar(); return; }
  else if(a==="config"){ g.fase="config"; }
  else if(a==="cadeado"){ ui.livre=!ui.livre; if(!ui.livre){ const P=PR[g.r.preta]; ui.escolha=ui.escolha.filter((n,i)=>encaixa(n,P.slots[i])); } }
  else if(a==="pegar"){ const n=+b.dataset.n, q=PR[g.r.preta].slots.length, i=ui.escolha.indexOf(n);
    if(i>=0) ui.escolha.splice(i,1); else if(ui.escolha.length<q) ui.escolha.push(n); else if(q===1) ui.escolha=[n]; }
  else if(a==="jogar"){ jogar(); return; }
  else if(a==="julgar"){ julgar(+b.dataset.i); window.scrollTo({top:0,behavior:"smooth"}); return; }
  else if(a==="marcar"){ alternarMarca(+b.dataset.n,+b.dataset.p); return; }
  else if(a==="desmarcar"){ alternarMarca(+b.dataset.n,+b.dataset.p); return; }
  else if(a==="limpar-marcas"){ marc=[]; guardar(CHAVE_MARC,marc); }
  else if(a==="copiar"){ const t=textoMarcadas(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="Copiado!";},()=>{prompt("Copie a lista:",t);}); return; }
  else if(a==="proxima"){ proxima(); window.scrollTo({top:0}); return; }
  else if(a==="descartar"){ const n=+b.dataset.n, i=ui.descarte.indexOf(n); if(i>=0) ui.descarte.splice(i,1); else if(ui.descarte.length<TROCA_MAX) ui.descarte.push(n); }
  else if(a==="trocar"){ trocar("voce",ui.descarte); novaRodada(); return; }
  else if(a==="manter"){ novaRodada(); return; }
  else if(a==="encerrar"){ g.fase="fim"; }
  salvar(); desenhar();
});
document.addEventListener("input",e=>{ if(e.target.id==="nome"){ g.nome=e.target.value.trim().slice(0,18)||"Você"; salvar(); } });
desenhar();
</script>
